<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placas de vídeo: preços para conferir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f2b;--bg2:#1c1745;--card:rgba(255,255,255,.06);--cardb:rgba(255,255,255,.12);--ink:#f3f0ff;--mute:#a9a3cf;--best:#ffd36b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ff;--bg2:#e4deff;--card:rgba(255,255,255,.75);--cardb:rgba(60,40,140,.14);--ink:#1d1647;--mute:#6a6396;--best:#b97800}}
:root[data-theme="light"]{--bg:#f4f1ff;--bg2:#e4deff;--card:rgba(255,255,255,.75);--cardb:rgba(60,40,140,.14);--ink:#1d1647;--mute:#6a6396;--best:#b97800}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
background:radial-gradient(900px 500px at 85% -5%,#6a3dff55,transparent 60%),radial-gradient(700px 500px at -10% 30%,#00d1b233,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-color:var(--bg);background-attachment:fixed;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:56px 22px 72px}
.hero{margin-bottom:44px;animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}
h1{font-family:Unbounded,Manrope,sans-serif;font-weight:700;font-size:clamp(2.1rem,7vw,4.4rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 16px;
background:linear-gradient(95deg,#fff 10%,#b9a6ff 45%,#5ff0d0 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) h1{background:linear-gradient(95deg,#1d1647,#6a3dff 55%,#00a58a);-webkit-background-clip:text;background-clip:text}}
.sub{color:var(--mute);font-size:1.1rem;max-width:52ch;margin:0 0 28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--cardb);border-radius:20px;padding:18px 20px;backdrop-filter:blur(10px)}
.stat b{display:block;font-family:Unbounded,sans-serif;font-weight:500;font-size:1.6rem;margin-bottom:2px}
.stat span{color:var(--mute);font-size:.9rem}
.bar{height:6px;border-radius:9px;background:var(--cardb);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#6a3dff,#5ff0d0);transition:width .5s}
section{--c:#76e04b;position:relative;margin:0 0 56px}
section.s2{--c:#2ee6c9}section.s3{--c:#a98bff}section.s4{--c:#ff9a5c}
.ghost{position:absolute;right:-6px;top:-34px;font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(4rem,16vw,9.5rem);line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--c);opacity:.28;pointer-events:none;user-select:none;white-space:nowrap}
h2{position:relative;display:flex;align-items:center;gap:12px;font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(1.3rem,3.6vw,1.9rem);margin:0 0 20px}
h2:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c)}
h2 small{font-family:Manrope,sans-serif;font-weight:600;font-size:.85rem;color:var(--mute)}
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--cardb);border-radius:22px;padding:20px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:14px;transition:border-color .2s,opacity .2s}
.card:hover{border-color:var(--c)}
.card.best{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 12px 40px -18px var(--c)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.store{font-weight:800;font-size:.95rem;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.model{font-weight:600;font-size:1.02rem;line-height:1.35;flex:1}
.price{font-family:Unbounded,sans-serif;font-weight:500;font-size:1.9rem;letter-spacing:-.03em}
.price small{font-size:.9rem;color:var(--mute);margin-right:4px;font-weight:300}
.tags{display:flex;gap:6px;flex-wrap:wrap;min-height:26px}
.tag{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--best);color:#2b1d00}
.tag.n{background:var(--cardb);color:var(--ink);font-weight:600}
.tick{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.9rem;cursor:pointer;padding-top:12px;border-top:1px dashed var(--cardb)}
.tick input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);margin:0;display:grid;place-items:center;cursor:pointer;transition:all .2s}
.tick input:checked{background:var(--c);border-color:var(--c)}
.tick input:checked:after{content:"";width:6px;height:11px;border:solid #10122a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick input:focus-visible,button:focus-visible{outline:3px solid var(--c,#b9a6ff);outline-offset:3px}
.card.done{opacity:.55}.card.done .model{text-decoration:line-through}
footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--mute);font-size:.88rem}
button{font:inherit;font-weight:600;background:var(--card);border:1px solid var(--cardb);color:var(--ink);border-radius:99px;padding:8px 18px;cursor:pointer}
</style>
</head>
<body>
<main>
<header class="hero">
<h1>Placas de vídeo</h1>
<p class="sub">Os preços que anotei, loja por loja. Confira cada oferta no site e marque como feita.</p>
<div class="stats" id="stats"></div>
</header>
<div id="list"></div>
<footer><span>Lista anotada em 10/10/2026. Os valores podem ter mudado.</span><button id="reset" type="button">Limpar marcações</button></footer>
</main>
<script>
var DATA=[
{g:"RTX 5060 Ti",items:[
{s:"KaBuM",m:"Asus RTX 5060 Ti 8GB Dual OC",p:3200},
{s:"Amazon",m:"MSI RTX 5060 Ti Shadow OC 2X Plus 8GB",p:3400},
{s:"Terabyte",m:"Zotac RTX 5060 Ti Twin Edge OC 16GB",p:3200,note:"16 GB pelo preço da de 8 GB"}]},
{g:"RTX 5060",items:[
{s:"Pichau",m:"Asus Dual RTX 5060",p:2900},
{s:"Amazon",m:"MSI RTX 5060 8GB Ventus 2X OC",p:3000}]},
{g:"RTX 4060",items:[
{s:"KaBuM",m:"Galax RTX 4060 OC 2X 8GB",p:2950}]},
{g:"RTX 3060",items:[
{s:"Pichau",m:"Gigabyte RTX 3060 Gaming OC",p:2000},
{s:"KaBuM",m:"Gigabyte RTX 3060 Gaming OC 8GB",p:2300}]}
];
var KEY="gpu-check-v2",state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function brl(n){return n.toLocaleString("pt-BR")}
function render(){
 var all=[],html="",done=0;
 DATA.forEach(function(d){d.items.forEach(function(i){all.push(i)})});
 var min=Math.min.apply(null,all.map(function(i){return i.p}));
 var ch=all.filter(function(i){return i.p===min})[0];
 DATA.forEach(function(d,gi){
  var gmin=Math.min.apply(null,d.items.map(function(i){return i.p}));
  html+='<section class="s'+(gi+1)+'"><span class="ghost" aria-hidden="true">'+d.g.replace("RTX ","")+'</span><h2>'+d.g+'<small>'+d.items.length+(d.items.length>1?' ofertas':' oferta')+'</small></h2><div class="grid">';
  d.items.forEach(function(i,ii){
   var id=gi+"-"+ii,c=!!state[id],b=d.items.length>1&&i.p===gmin;if(c)done++;
   html+='<article class="card'+(b?' best':'')+(c?' done':'')+'"><div class="top"><span class="store">'+i.s+'</span><span class="tags">'+(b?'<span class="tag">Menor da linha</span>':'')+'</span></div>'
    +'<div class="model">'+i.m+'</div>'+(i.note?'<div class="tags"><span class="tag n">'+i.note+'</span></div>':'')
    +'<div class="price"><small>R$</small>'+brl(i.p)+'</div>'
    +'<label class="tick"><input type="checkbox" data-id="'+id+'"'+(c?' checked':'')+'>Já conferi no site</label></article>';
  });
  html+='</div></section>';
 });
 document.getElementById("list").innerHTML=html;
 document.getElementById("stats").innerHTML=
  '<div class="stat"><b>'+all.length+'</b><span>ofertas em '+DATA.length+' linhas de placas</span></div>'
 +'<div class="stat"><b>R$ '+brl(min)+'</b><span>a mais barata: '+ch.m+' ('+ch.s+')</span></div>'
 +'<div class="stat"><b>'+done+' de '+all.length+'</b><span>já conferidas</span><div class="bar"><i style="width:'+Math.round(done/all.length*100)+'%"></i></div></div>';
}
document.addEventListener("change",function(e){
 var id=e.target.getAttribute&&e.target.getAttribute("data-id");
 if(id===null)return;
 if(e.target.checked)state[id]=1;else delete state[id];
 save();render();
 var el=document.querySelector('[data-id="'+id+'"]');if(el)el.focus();
});
document.getElementById("reset").onclick=function(){state={};save();render()};
render();
</script>
</body>
</html>
