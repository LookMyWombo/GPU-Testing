<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hardware | Painel de preços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Tokens */
:root{
  --bg:#050507;--panel:#0d0d12;--card:#101017;--line:#22222d;--ink:#f2f2f7;--mute:#8b8b9e;
  --best:#ffd36b;--glow:#7c5cff;--focus:#4df2d6;
  --display:Unbounded,Manrope,sans-serif;
  --body:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}

/* Base */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 var(--body);background:var(--bg);
  background-image:radial-gradient(800px 420px at 90% -8%,#7c5cff40,transparent 65%),
                   radial-gradient(600px 400px at -8% 22%,#00e5c322,transparent 65%);
}
main{max-width:1080px;margin:0 auto;padding:48px 22px 72px}
:is(input,select,button):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}*{transition:none!important}}

/* Cabeçalho e resumo */
.hero{margin-bottom:30px;animation:enter .8s ease both}
.hero h1{
  margin:0 0 12px;font:700 clamp(2rem,6.5vw,4rem)/1.04 var(--display);letter-spacing:-.035em;
  background:linear-gradient(95deg,#fff 15%,#b8a8ff 55%,#4df2d6);background-clip:text;-webkit-background-clip:text;color:transparent;
}
.subtitle{max-width:54ch;margin:0 0 26px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{padding:16px 18px;background:linear-gradient(180deg,#14141c,var(--panel));border:1px solid var(--line);border-radius:16px}
.stat b{display:block;font:600 1.4rem var(--display)}
.stat span{color:var(--mute);font-size:.86rem}
.progress{height:5px;margin-top:10px;border-radius:9px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7c5cff,#4df2d6);box-shadow:0 0 12px #7c5cff;transition:width .5s}

/* Ferramentas */
.toolbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  margin:26px -8px 34px;padding:12px 8px;background:#050507dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
input[type=search],select{min-width:0;padding:9px 14px;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px}
input[type=search]{flex:1 1 200px}
.tabs{display:flex;gap:8px;flex:1 1 100%;overflow-x:auto;padding-bottom:2px}
.tab{padding:8px 18px;white-space:nowrap;font:700 .95rem var(--body);color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:all .2s}
.tab:hover{color:var(--ink);border-color:var(--glow)}
.tab[aria-pressed=true]{color:#fff;background:var(--glow);border-color:var(--glow);box-shadow:0 0 18px #7c5cff77}
.tab small{margin-left:6px;font-weight:600;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.btn,.chip{padding:6px 14px;font:600 .88rem var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:all .2s}
.btn:hover,.chip:hover{border-color:var(--glow)}
.chip[aria-pressed=true]{background:var(--glow);border-color:var(--glow);box-shadow:0 0 16px #7c5cff77}

/* Linhas de placa (cada uma com sua cor em --c) */
.series{--c:#7dff5a;position:relative;margin-bottom:54px}
.s2{--c:#2ee6c9}.s3{--c:#a98bff}.s4{--c:#ff9a5c}.s5{--c:#ff5c8a}.s6{--c:#5cb8ff}
.ghost{
  position:absolute;top:-32px;right:-4px;font:700 clamp(4rem,15vw,9rem)/1 var(--display);white-space:nowrap;
  color:transparent;-webkit-text-stroke:1.5px var(--c);opacity:.22;pointer-events:none;user-select:none;
}
.series h2{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 clamp(1.2rem,3.4vw,1.8rem) var(--display)}
.series h2::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 20px var(--c),0 0 4px var(--c)}
.series h2 small{font:600 .84rem var(--body);color:var(--mute)}
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

/* Cartões */
.card{
  display:flex;flex-direction:column;gap:12px;padding:18px;background:linear-gradient(180deg,#15151e,var(--card));
  border:1px solid var(--line);border-radius:18px;transition:border-color .2s,box-shadow .2s,opacity .2s;
}
.card:hover{border-color:var(--c);box-shadow:0 10px 40px -20px var(--c)}
.card.is-best{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 14px 44px -18px var(--c)}
.card.is-done{opacity:.5}
.card.is-done .model{text-decoration:line-through}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.store{padding:3px 12px;font-weight:800;font-size:.9rem;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:99px}
.model{flex:1;font-weight:600;line-height:1.35}
.tag{padding:2px 9px;font-weight:800;font-size:.74rem;white-space:nowrap;color:#2b1d00;background:var(--best);border-radius:99px}
.tag.is-note{font-weight:600;color:var(--ink);background:var(--line)}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font:600 1.8rem var(--display);letter-spacing:-.03em}
.price small{margin-right:-4px;font-weight:400;font-size:.85rem;color:var(--mute)}
.price.is-empty{font:600 .95rem var(--body);letter-spacing:0;color:var(--mute)}
.diff{font:800 .8rem var(--body);letter-spacing:0;color:var(--mute)}

/* Caixa "Já conferi no site" */
.check{display:flex;align-items:center;gap:10px;padding-top:10px;font-size:.88rem;color:var(--mute);border-top:1px dashed var(--line);cursor:pointer}
.check input{appearance:none;display:grid;place-items:center;width:22px;height:22px;margin:0;border:2px solid #4a4a5c;border-radius:50%;cursor:pointer;transition:all .2s}
.check input:checked{background:var(--c);border-color:var(--c);box-shadow:0 0 14px var(--c)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible{outline-offset:3px}
.empty{padding:40px 0;text-align:center;color:var(--mute)}

/* Rodapé */
.footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-top:20px;font-size:.86rem;color:var(--mute);border-top:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

@media print{
  body{color:#000;background:#fff}
  .toolbar,.actions,.ghost{display:none}
  .card{break-inside:avoid;background:#fff;border-color:#999}
}
</style>
</head>

<body>
<main>
  <header class="hero">
    <h1>Painel de preços<br>de hardware</h1>
    <p class="subtitle">Todas as ofertas anotadas, com filtros e ordenação. Marque cada uma depois de conferir o valor no site da loja.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="tabs" id="tabs" role="group" aria-label="Categoria"></div>
    <input type="search" id="search" placeholder="Buscar modelo ou marca" aria-label="Buscar modelo ou marca">
    <select id="sort" aria-label="Ordenar">
      <option value="price-asc">Menor preço</option>
      <option value="price-desc">Maior preço</option>
      <option value="store">Loja (A–Z)</option>
    </select>
    <button type="button" class="chip" id="pending" aria-pressed="false">Só pendentes</button>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por loja"></div>
  </div>

  <div id="list"></div>

  <footer class="footer">
    <span>Lista anotada em 10/10/2026. Os valores podem ter mudado.</span>
    <div class="actions">
      <button type="button" class="btn" id="copy">Copiar lista</button>
      <button type="button" class="btn" id="print">Imprimir</button>
      <button type="button" class="btn" id="reset">Limpar marcações</button>
    </div>
  </footer>
</main>

<script>
/* Dados: s = loja, m = modelo, p = preço (opcional), note = observação (opcional) */
const CATEGORIES = [
  { key: "gpu", name: "Placas de vídeo", series: [
    { name: "RTX 5060 Ti", ghost: "5060 Ti", items: [
      { s: "KaBuM",    m: "Asus RTX 5060 Ti 8GB Dual OC",          p: 3200 },
      { s: "Amazon",   m: "MSI RTX 5060 Ti Shadow OC 2X Plus 8GB", p: 3400 },
      { s: "Terabyte", m: "Zotac RTX 5060 Ti Twin Edge OC 16GB",   p: 3200, note: "16 GB pelo preço da de 8 GB" }
    ]},
    { name: "RTX 5060", ghost: "5060", items: [
      { s: "Pichau",   m: "Asus Dual RTX 5060",            p: 2900 },
      { s: "Amazon",   m: "MSI RTX 5060 8GB Ventus 2X OC", p: 3000 }
    ]},
    { name: "RTX 4060", ghost: "4060", items: [
      { s: "KaBuM",    m: "Galax RTX 4060 OC 2X 8GB", p: 2950 }
    ]},
    { name: "RTX 3060", ghost: "3060", items: [
      { s: "Pichau",   m: "Gigabyte RTX 3060 Gaming OC",     p: 2000 },
      { s: "KaBuM",    m: "Gigabyte RTX 3060 Gaming OC 8GB", p: 2300 }
    ]}
  ]},
  { key: "cpu", name: "Processadores", series: [
    { name: "AMD Ryzen 7 5700X", ghost: "5700X", items: [
      { s: "KaBuM",  m: "AMD Ryzen 7 5700X, 3.4GHz (4.6GHz Max Turbo), 8 Cores, 16 Threads", p: 1200 },
      { s: "Pichau", m: "AMD Ryzen 7 5700X, 3.4GHz (4.6GHz Max Turbo), 8 Cores, 16 Threads", p: 1200 },
      { s: "Amazon", m: "AMD Ryzen 7 5700X, 3.4GHz (4.6GHz Max Turbo), 8 Cores, 16 Threads", p: 1200 }
    ]}
  ]},
  { key: "mon", name: "Monitores", series: [
    { name: "Asus TUF 240Hz", ghost: "240Hz", items: [
      { s: "Pichau", m: "Asus TUF (240Hz)", p: 1100 },
      { s: "KaBuM",  m: "Asus TUF (240Hz)", p: 1100 }
    ]},
    { name: "Asus TUF 260Hz", ghost: "260Hz", items: [
      { s: "KaBuM",    m: "Asus TUF (260Hz)", p: 860 },
      { s: "Terabyte", m: "Asus TUF (260Hz)", p: 850 }
    ]},
    { name: "Asus TUF 310Hz", ghost: "310Hz", items: [
      { s: "KaBuM", m: "Asus TUF (310Hz)", p: 1100 }
    ]},
    { name: "Alienware 320Hz", ghost: "320Hz", items: [
      { s: "Amazon", m: "Alienware (320Hz)", p: 1300 }
    ]},
    { name: "AOC Agon 310Hz", ghost: "310Hz", items: [
      { s: "Amazon", m: "AOC Agon (310Hz)", p: 1200 }
    ]},
    { name: "Pichau Nexus 360Hz", ghost: "360Hz", items: [
      { s: "Pichau", m: "Pichau Nexus (360Hz)", p: 1200 }
    ]}
  ]}
];

/* Estado */
const KEY = "hardware-check-v4";
const filters = { cat: 0, query: "", sort: "price-asc", store: "", pending: false };
let checked = {};
try { checked = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}

CATEGORIES.forEach(c => {
  c.series.forEach((s, si) => s.items.forEach((item, ii) => item.id = `${c.key}-${si}-${ii}`));
  c.items = c.series.flatMap(s => s.items);
  c.stores = [...new Set(c.items.map(i => i.s))].sort();
});
const current = () => CATEGORIES[filters.cat];

/* Auxiliares */
const $ = id => document.getElementById(id);
const brl = n => n.toLocaleString("pt-BR");
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const priced = items => items.filter(i => i.p != null);
const lowest = items => { const p = priced(items).map(i => i.p); return p.length ? Math.min(...p) : null; };
const SORTS = {
  "price-asc":  (a, b) => (a.p ?? 1e12) - (b.p ?? 1e12),
  "price-desc": (a, b) => (b.p ?? -1) - (a.p ?? -1),
  "store":      (a, b) => a.s.localeCompare(b.s) || (a.p ?? 1e12) - (b.p ?? 1e12)
};

function matches(item, series) {
  const text = `${item.m} ${item.s} ${series.name}`.toLowerCase();
  return (!filters.store || item.s === filters.store)
      && (!filters.pending || !checked[item.id])
      && text.includes(filters.query.trim().toLowerCase());
}

/* Renderização */
function renderTabs() {
  $("tabs").innerHTML = CATEGORIES.map((c, i) =>
    `<button type="button" class="tab" data-cat="${i}" aria-pressed="${i === filters.cat}">${c.name}<small>${c.items.length}</small></button>`
  ).join("");
}

function renderChips() {
  const chip = (label, store) =>
    `<button type="button" class="chip" data-store="${esc(store)}" aria-pressed="${filters.store === store}">${esc(label)}</button>`;
  $("chips").innerHTML = chip("Todas as lojas", "") + current().stores.map(s => chip(s, s)).join("");
}

function renderStats() {
  const { items, series, stores } = current();
  const withPrice = priced(items);
  const done = items.filter(i => checked[i.id]).length;
  let cheapest = `<b>—</b><span>preços ainda não informados</span>`;
  let average = `<b>—</b><span>preço médio indisponível</span>`;

  if (withPrice.length) {
    const min = lowest(items);
    const best = withPrice.find(i => i.p === min);
    const avg = Math.round(withPrice.reduce((sum, i) => sum + i.p, 0) / withPrice.length);
    cheapest = `<b>R$ ${brl(min)}</b><span>mais barata: ${esc(best.m)} (${esc(best.s)})</span>`;
    average = `<b>R$ ${brl(avg)}</b><span>preço médio da lista</span>`;
  }

  $("stats").innerHTML = `
    <div class="stat"><b>${items.length}</b><span>ofertas em ${stores.length} lojas</span></div>
    <div class="stat">${cheapest}</div>
    <div class="stat">${average}</div>
    <div class="stat"><b>${done} de ${items.length}</b><span>já conferidas</span>
      <div class="progress"><i style="width:${Math.round(done / items.length * 100)}%"></i></div></div>`;
}

function renderCard(item, series) {
  const done = !!checked[item.id];
  const hasPrice = item.p != null;
  const min = lowest(series.items);
  const multi = priced(series.items).length > 1;
  const best = multi && hasPrice && item.p === min;
  const diff = hasPrice && multi ? item.p - min : 0;

  return `
    <article class="card${best ? " is-best" : ""}${done ? " is-done" : ""}">
      <div class="card-top"><span class="store">${esc(item.s)}</span>${best ? '<span class="tag">Menor da linha</span>' : ""}</div>
      <div class="model">${esc(item.m)}</div>
      ${item.note ? `<div><span class="tag is-note">${esc(item.note)}</span></div>` : ""}
      ${hasPrice
        ? `<div class="price"><small>R$</small>${brl(item.p)}${diff ? `<span class="diff">+R$ ${brl(diff)} no grupo</span>` : ""}</div>`
        : `<div class="price is-empty">Preço ainda não informado</div>`}
      <label class="check"><input type="checkbox" data-id="${item.id}" ${done ? "checked" : ""}>Já conferi no site</label>
    </article>`;
}

function renderSeries(series, index) {
  const items = series.items.filter(i => matches(i, series)).sort(SORTS[filters.sort]);
  if (!items.length) return "";
  return `
    <section class="series s${index % 6 + 1}">
      <span class="ghost" aria-hidden="true">${esc(series.ghost)}</span>
      <h2>${esc(series.name)}<small>${items.length} ${items.length > 1 ? "ofertas" : "oferta"}</small></h2>
      <div class="grid">${items.map(i => renderCard(i, series)).join("")}</div>
    </section>`;
}

function renderList() {
  $("list").innerHTML = current().series.map(renderSeries).join("")
    || '<p class="empty">Nenhuma oferta encontrada com esses filtros.</p>';
}

/* Ações */
function update() {
  try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (e) {}
  renderStats();
  renderList();
}

function copyList(btn) {
  const text = ["LISTA DE HARDWARE (anotado em 10/10/2026)", ...CATEGORIES.flatMap(c => [
    "", `===== ${c.name} =====`,
    ...c.series.flatMap(s => [
      "", s.name,
      ...s.items.map(i => `- ${i.s}: ${i.p != null ? "R$ " + brl(i.p) : "preço não informado"} (${i.m})${checked[i.id] ? " [conferido]" : ""}`)
    ])
  ])].join("\n");
  const say = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = "Copiar lista", 1600); };
  navigator.clipboard.writeText(text).then(() => say("Copiado"), () => say("Não foi possível copiar"));
}

/* Eventos */
document.addEventListener("change", e => {
  const id = e.target.dataset.id;
  if (id === undefined) return;
  e.target.checked ? checked[id] = 1 : delete checked[id];
  update();
  document.querySelector(`[data-id="${id}"]`)?.focus();
});

document.addEventListener("click", e => {
  const tab = e.target.closest("[data-cat]");
  if (tab) {
    filters.cat = +tab.dataset.cat;
    filters.store = "";
    renderTabs(); renderChips(); update();
    return;
  }
  const chip = e.target.closest("[data-store]");
  if (chip) {
    filters.store = chip.dataset.store;
    renderChips(); renderList();
  }
});

$("search").oninput  = e => { filters.query = e.target.value; renderList(); };
$("sort").onchange   = e => { filters.sort = e.target.value; renderList(); };
$("pending").onclick = e => { filters.pending = !filters.pending; e.currentTarget.setAttribute("aria-pressed", filters.pending); renderList(); };
$("reset").onclick   = () => { checked = {}; update(); };
$("print").onclick   = () => window.print();
$("copy").onclick    = e => copyList(e.currentTarget);

renderTabs();
renderChips();
update();
</script>
</body>
</html>
